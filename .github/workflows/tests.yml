name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Num repositorio publico qualquer pessoa pode abrir um pull request, e o
# workflow roda com o codigo dela. Sem escrita no token, um PR malicioso
# nao consegue alterar o repositorio nem publicar nada.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # O runner nao tem tela. Sem isto o pystray tenta abrir o X11 ja no
        # import (tray.py, importado pelos testes do loop) e derruba a suite.
        env:
          PYSTRAY_BACKEND: dummy
        run: pytest tests/ -v
